name: TahadiAlJamaa
options:
  bundleIdPrefix: com.tahadi
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  TahadiAlJamaa:
    type: application
    platform: iOS
    sources:
      - path: TahadiAlJamaa
        excludes:
          - Info.plist
      - path: Web
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Refresh offline game content
        script: python3 "$SRCROOT/prepare_web.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahadi.aljamaa
        PRODUCT_NAME: TahadiAlJamaa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TahadiAlJamaa/Info.plist
    scheme:
      testTargets: []
