<section id="home" class="screen active"><div class="hero"><h1>تحدّي الجَمعة</h1><p>جمعتكم جاهزة؟ التحدّي يبدأ الآن!</p></div><button class="btn" onclick="goSetup()">ابدأ التحدّي</button></section>
<section id="setup" class="screen"><div class="panel"><h2 class="center">إعداد الفرق</h2><div class="row"><div class="field"><label>الفريق الأول</label><input id="t1" value="الفريق الأحمر"></div><div class="field"><label>الفريق الثاني</label><input id="t2" value="الفريق الأزرق"></div></div><div class="row"><div class="field"><label>العمر</label><select id="a1"></select></div><div class="field"><label>العمر</label><select id="a2"></select></div></div><div class="field"><label>عدد الجولات</label><select id="rounds"><option>5</option><option selected>10</option><option>15</option></select></div><button class="btn" onclick="goCategories()">التالي</button></div><div class="nav"><button class="btn secondary" onclick="home()">🏠 الصفحة الرئيسية</button><button class="btn secondary" onclick="resetForm()">↻ إعادة الإعداد</button></div></section>

const Q=[];
function stableId(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return 'q_'+(h>>>0).toString(36)}
function add(cat,q,a,min=0,topic='',type='direct'){const id=stableId(cat+'|'+q+'|'+a);const topicId=topic||stableId(cat+'|'+String(a).replace(/[\s،.؟!]/g,'').toLowerCase());Q.push({id,cat,q,a,min,topicId,type})}

const HISTORY_KEY='tahadi_question_history_v2';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}')}catch(e){return {}}}
function saveHistory(h){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h))}catch(e){}}
function markPlayed(q){const h=loadHistory(),now=Date.now();const old=h[q.id]||{};h[q.id]={last:now,count:(old.count||0)+1,topic:q.topicId};saveHistory(h)}
function getQuestion(){
  const age=st.teams[st.turn].age,h=loadHistory();
  let eligible=Q.filter(q=>st.selected.includes(q.cat)&&q.min<=age&&!st.used.has(q.id)&&!st.usedTopics.has(q.topicId));
  if(!eligible.length) eligible=Q.filter(q=>st.selected.includes(q.cat)&&q.min<=age&&!st.used.has(q.id));
  if(!eligible.length) eligible=Q.filter(q=>st.selected.includes(q.cat)&&q.min<=age);
  const unseen=eligible.filter(q=>!h[q.id]);
  let pool=unseen.length?unseen:eligible;
  const recentTypes=new Set(st.usedTypes.slice(-2));
  const varied=pool.filter(q=>!recentTypes.has(q.type));
  if(varied.length) pool=varied;
  const minCount=Math.min(...st.selected.map(cat=>st.catCounts[cat]||0));
  const balanced=pool.filter(q=>(st.catCounts[q.cat]||0)<=minCount);
  if(balanced.length) pool=balanced;
  let q;
  if(unseen.length){
    q=pool[Math.floor(Math.random()*pool.length)];
  }else{
    const oldest=Math.min(...pool.map(x=>h[x.id]?.last||0));
    const oldestPool=pool.filter(x=>(h[x.id]?.last||0)===oldest);
    q=oldestPool[Math.floor(Math.random()*oldestPool.length)];
  }
  st.used.add(q.id);st.usedTopics.add(q.topicId);st.usedTypes.push(q.type);if(st.usedTypes.length>4)st.usedTypes.shift();st.catCounts[q.cat]=(st.catCounts[q.cat]||0)+1;markPlayed(q);return q
}
function beginQuestion(){stopAll();st.current=getQuestion();document.getElementById('turnBadge').textContent=(st.turn===0?'🔴 ':'🔵 ')+st.teams[st.turn].name;document.getElementById('catBadge').textContent=CAT.find(c=>c[0]===st.current.cat)[1];document.getElementById('question').textContent=st.current.q;document.getElementById('answerBox').textContent=st.current.a;document.getElementById('answerBox').classList.add('hidden');document.getElementById('resultBtns').classList.add('hidden');document.getElementById('revealBtn').classList.remove('hidden');show('game');startTimer()}
function startTimer(){clearTimer();st.deadline=Date.now()+15000;st.countdownStarted=false;document.getElementById('timer').textContent='15';play('thinking',true);st.timer=setInterval(tick,100);tick()}
function tick(){let ms=st.deadline-Date.now();if(ms<=0){document.getElementById('timer').textContent='0';clearTimer();stopAll();play('timeup');reveal(true);return}let sec=Math.ceil(ms/1000);document.getElementById('timer').textContent=sec;if(sec<=9&&!st.countdownStarted){st.countdownStarted=true;A.thinking.pause();A.thinking.currentTime=0;play('countdown')}}
function clearTimer(){if(st.timer){clearInterval(st.timer);st.timer=null}}
function reveal(fromTimeout=false){clearTimer();if(!fromTimeout)stopAll();document.getElementById('answerBox').classList.remove('hidden');document.getElementById('resultBtns').classList.remove('hidden');document.getElementById('revealBtn').classList.add('hidden')}
function mark(ok){stopAll();if(ok){st.scores[st.turn]++;play('correct')}else play(Math.random()<.5?'wrong1':'wrong2');updateScores();setTimeout(nextTurn,700)}
function nextTurn(){st.qnum++;if(st.qnum>=st.rounds){finish();return}st.turn=1-st.turn;showTurnIntro()}
function updateScores(){if(!st.teams.length)return;document.getElementById('s1n').textContent='🔴 '+st.teams[0].name;document.getElementById('s2n').textContent='🔵 '+st.teams[1].name;document.getElementById('s1').textContent=st.scores[0];document.getElementById('s2').textContent=st.scores[1]}
function finish(){clearTimer();stopAll();const a=st.scores[0],b=st.scores[1];let title,details;if(a===b){title='تعادل 🤝';details=`${st.teams[0].name}: ${a} نقطة<br>${st.teams[1].name}: ${b} نقطة`;}else{const wi=a>b?0:1,li=1-wi;title=`🏆 الفائز: ${(wi===0?'🔴 ':'🔵 ')+st.teams[wi].name}`;details=`الفائز — ${(wi===0?'🔴 ':'🔵 ')+st.teams[wi].name}: ${st.scores[wi]} نقطة<br>الخاسر — ${(li===0?'🔴 ':'🔵 ')+st.teams[li].name}: ${st.scores[li]} نقطة`;}document.getElementById('winner').textContent=title;document.getElementById('finalScore').innerHTML=details;show('finish');play(Math.random()<.5?'win1':'win2')} function backToCategories(){clearTimer();stopAll();show('categories');play('transition')}
function restartSame(){clearTimer();stopAll();if(!st.teams.length){show('home');return}st.turn=0;st.qnum=0;st.scores=[0,0];st.used=new Set();st.usedTopics=new Set();st.usedTypes=[];st.catCounts={};updateScores();beginQuestion()}
</script></body></html>
